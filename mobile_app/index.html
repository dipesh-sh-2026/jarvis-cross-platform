<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS Mobile AI Assistant</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00e5ff">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #030812;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow-x: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(0, 229, 255, 0.2);
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-logo {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(0, 229, 255, 0.15); border: 1px solid #00e5ff;
            display: flex; align-items: center; justify-content: center;
            color: #00e5ff; font-size: 16px;
        }
        .brand h2 { font-size: 18px; font-weight: 700; }
        .status-badge {
            font-size: 10px; font-weight: 700; padding: 4px 10px;
            border-radius: 12px; background: rgba(16, 185, 129, 0.2);
            color: #10b981; border: 1px solid rgba(16, 185, 129, 0.4);
        }
        
        /* Mobile Arc Reactor HUD */
        .mobile-hud {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; margin: 24px 0;
        }
        .arc-circle {
            width: 220px; height: 220px; border-radius: 50%;
            border: 2px dashed #00e5ff; position: relative;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
            animation: spin 20s linear infinite; cursor: pointer;
        }
        .arc-inner {
            width: 150px; height: 150px; border-radius: 50%;
            border: 2px dotted #9d4edd; position: absolute;
            animation: spinRev 12s linear infinite;
        }
        .arc-core {
            width: 100px; height: 100px; border-radius: 50%;
            background: rgba(0, 229, 255, 0.15); border: 2px solid #00e5ff;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px #00e5ff; z-index: 10;
        }
        .arc-core h3 { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #fff; }
        
        /* Subtitles & Question Display */
        .qa-card {
            width: 100%; background: rgba(16, 24, 40, 0.8);
            border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 14px;
            padding: 16px; margin-bottom: 16px;
        }
        .qa-label { font-size: 10px; font-weight: 700; color: #00e5ff; margin-bottom: 4px; }
        .qa-val { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #fff; line-height: 1.5; }
        
        /* Action Buttons */
        .btn-talk {
            width: 100%; padding: 16px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, #00e5ff, #7b2cbf);
            color: #fff; font-family: 'Outfit', sans-serif; font-size: 16px;
            font-weight: 700; letter-spacing: 1px; cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-talk.listening {
            background: linear-gradient(135deg, #ef4444, #f59e0b);
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.6);
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes spinRev { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">
            <div class="brand-logo"><i class="fa-solid fa-brain"></i></div>
            <h2>JARVIS <span>MOBILE</span></h2>
        </div>
        <span class="status-badge" id="net-status">SYNCED • 38ms</span>
    </div>

    <div class="mobile-hud">
        <div class="arc-circle" id="mobile-arc-trigger">
            <div class="arc-inner"></div>
            <div class="arc-core">
                <h3>R.A.N.G.E.R</h3>
            </div>
        </div>
    </div>

    <div class="qa-card">
        <div class="qa-label">QUESTION:</div>
        <div class="qa-val" id="mobile-q">"Tap button to ask voice question..."</div>
    </div>

    <div class="qa-card">
        <div class="qa-label">R.A.N.G.E.R ANSWER:</div>
        <div class="qa-val" id="mobile-a">"Good day, Sir. Ranger mobile node ready."</div>
    </div>

    <button class="btn-talk" id="btn-mobile-talk">
        <i class="fa-solid fa-microphone"></i> TALK TO J.A.R.V.I.S.
    </button>

    <script>
        const btnTalk = document.getElementById('btn-mobile-talk');
        const arcTrigger = document.getElementById('mobile-arc-trigger');
        const qVal = document.getElementById('mobile-q');
        const aVal = document.getElementById('mobile-a');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.onstart = () => {
                btnTalk.classList.add('listening');
                btnTalk.innerHTML = '<i class="fa-solid fa-waveform"></i> LISTENING...';
            };
            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                qVal.textContent = `"${text}"`;
                sendMobileQuery(text);
            };
            recognition.onend = () => {
                btnTalk.classList.remove('listening');
                btnTalk.innerHTML = '<i class="fa-solid fa-microphone"></i> TALK TO J.A.R.V.I.S.';
            };
        }

        function sendMobileQuery(query) {
            fetch('http://localhost:8080/api/v1/mobile/voice-query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ device_id: 'mobile-app', query_text: query })
            })
            .then(res => res.json())
            .then(data => {
                const reply = data.jarvis_response || "Query processed by Jarvis.";
                aVal.textContent = `"${reply}"`;
                speak(reply);
            })
            .catch(err => {
                const reply = `Jarvis processed: "${query}". State synced across mobile app.`;
                aVal.textContent = `"${reply}"`;
                speak(reply);
            });
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.rate = 1.0;
                window.speechSynthesis.speak(u);
            }
        }

        function toggleTalk() {
            if (recognition) {
                try { recognition.start(); } catch(e) {}
            } else {
                const p = prompt("Enter voice question:");
                if (p) { qVal.textContent = `"${p}"`; sendMobileQuery(p); }
            }
        }

        btnTalk.addEventListener('click', toggleTalk);
        arcTrigger.addEventListener('click', toggleTalk);
    </script>
</body>
</html>
