version: '3.8'

services:
  jarvis-core:
    build: .
    container_name: jarvis-production-server
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
    restart: always
